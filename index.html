<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças — Celular</title>
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json?v=7">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/app.css?v=2026.11.14-5">
<script>try{if(localStorage.getItem('finm_lock'))document.documentElement.dataset.locked='1'}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="month-nav">
        <button class="icon-btn" data-act="prevM" title="Mês anterior">‹</button>
        <span id="monthLabel" data-act="todayM" title="Voltar ao mês atual" style="cursor:pointer"></span>
        <button class="icon-btn" data-act="nextM" title="Próximo mês">›</button>
      </div>
      <button class="btn sm" data-act="todayM">Mês atual</button>
      <span id="lkBtn" data-act="lkBotao" role="button" tabindex="0" title="Bloquear (Alt+L)" style="cursor:pointer;font-size:15px;line-height:1">🔓</span><span id="syDot" data-act="nav" data-id="settings" style="cursor:pointer;font-size:13px;white-space:nowrap"></span><span id="saveStatus" class="pill" data-act="nav" data-id="settings" style="cursor:pointer">● Carregando…</span>
      <button class="btn sm" id="reconnectBtn" data-act="reconnectFile" hidden>🔌 Reconectar arquivo</button>
      <button class="btn sm" data-act="theme" title="Escolher tema" id="themeBtn">🎨 Tema</button>
      <button class="btn primary" data-act="addExpense">+ Lançar gasto</button>
    </header>
    <section id="view"></section>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="modal" class="modal hidden"><form class="modal-card" id="modalForm" autocomplete="off"></form></div>
<div id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="js/app.js?v=2026.11.14-5"></script>
</body>
</html>
